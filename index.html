<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a41">
<title>Victoria's 24Game</title>
<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --ink:#1b2a41; --muted:#64708a; --line:#d9dfeb;
  --card:#ffffff; --card-sel:#dbe9ff; --accent:#2f6fed; --accent-ink:#fff;
  --good:#1e9e5a; --bad:#d6453d; --op:#eef2fa; --op-sel:#2f6fed;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#111827; --panel:#1b2433; --ink:#e8edf6; --muted:#93a0b8; --line:#2c3850;
  --card:#243049; --card-sel:#27457a; --accent:#5b93ff; --accent-ink:#0b1220; --op:#26324a; --op-sel:#5b93ff;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
main{width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:1.4rem;letter-spacing:.5px}
select,button{font:inherit;color:inherit}
select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 0;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.stat b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.board{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.num{aspect-ratio:1.5/1;background:var(--card);border:2px solid var(--line);border-radius:16px;
  font-size:clamp(2rem,10vw,3rem);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .08s,border-color .15s,background .15s;font-variant-numeric:tabular-nums}
.num:active{transform:scale(.96)}
.num.sel{border-color:var(--accent);background:var(--card-sel)}
.num.res{border-style:dashed}
.num.frac{font-size:clamp(1.6rem,8vw,2.4rem)}
.num.q{border-style:dashed;color:var(--muted)}
.num.xv{border-color:var(--accent)}
.num.pop{animation:pop .25s}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.num.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* Variables mode */
.picker{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.plabel{font-size:.8rem;color:var(--muted);text-align:center}
.pks{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.pk{background:var(--op);border:1px solid var(--line);border-radius:10px;padding:10px 0;font-weight:700;cursor:pointer}
.pk.on{background:var(--op-sel);color:var(--accent-ink);border-color:var(--op-sel)}
.pk:disabled{opacity:.5;cursor:default}
.wheels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wheel{border:2px solid var(--line);border-radius:16px;padding:8px;position:relative}
.wheel.ok{border-color:var(--good)}
.wheel.ok::after{content:"\2713 24";position:absolute;top:-10px;right:10px;background:var(--good);color:#fff;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:10px}
.wl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:center;margin-bottom:6px}
.wheels{position:relative}
.bridge{--bw:calc(min(100vw,520px)*.21);position:absolute;left:calc(50% - var(--bw)/2);bottom:8px;width:var(--bw);
  aspect-ratio:1.2/1;z-index:2;border-radius:12px;font-size:clamp(1.4rem,7vw,2.2rem);box-shadow:0 4px 14px rgba(0,0,0,.22)}
.bridge.set{border-color:var(--accent)}
.bridge.dim{opacity:.45}
.num.ph{visibility:hidden;pointer-events:none}
.cards.sm{gap:8px}
.sm .num{aspect-ratio:1.2/1;border-radius:12px;font-size:clamp(1.4rem,7vw,2.2rem)}
.sm .num.frac{font-size:clamp(1.1rem,5.5vw,1.7rem)}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.op{background:var(--op);border:1px solid var(--line);border-radius:14px;padding:12px 0;font-size:1.7rem;font-weight:600;cursor:pointer}
.op.sel{background:var(--op-sel);color:var(--accent-ink);border-color:var(--op-sel)}
.msg{min-height:1.6em;text-align:center;font-weight:600}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)} .msg.info{color:var(--muted);font-weight:500}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 4px;cursor:pointer;font-size:.9rem}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.hint{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:.95rem;display:none;white-space:pre-line}
.hint.show{display:block}
.hdr-r{display:flex;gap:8px;align-items:center}
.snd{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px;cursor:pointer;display:flex;align-items:center;color:var(--muted)}
.msg.pop{animation:msgpop .45s}
@keyframes msgpop{0%{transform:scale(.8)}55%{transform:scale(1.1)}100%{transform:scale(1)}}
.challenge{display:none;background:var(--card-sel);border:1px solid var(--accent);border-radius:14px;padding:12px;text-align:center}
.ch-title{font-weight:700;margin-bottom:10px}
.ch-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ch-row .btn{padding:9px 12px}
#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50;display:none}
footer{text-align:center;color:var(--muted);font-size:.78rem}
</style>
</head>
<body>
<main>
  <header>
    <h1>Victoria's 24Game</h1>
    <div class="hdr-r">
      <button class="snd" id="snd" aria-label="Sound on"></button>
      <select id="level" aria-label="Difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
  </header>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <div class="seg" id="seg" role="tablist" aria-label="Game mode">
    <button data-mode="classic" class="on">Classic</button>
    <button data-mode="var">Variables</button>
    <button data-mode="neg">Negatives</button>
  </div>

  <section class="stats" aria-label="Stats">
    <div class="stat"><b id="sTime">0:00</b><span>Time</span></div>
    <div class="stat"><b id="sSolved">0</b><span>Solved</span></div>
    <div class="stat"><b id="sStreak">0</b><span>Streak</span></div>
    <div class="stat"><b id="sBest">-</b><span>Best</span></div>
  </section>

  <section class="board">
    <div class="cards" id="cards"></div>
    <div id="vbox" style="display:none">
      <div class="picker">
        <div class="plabel">Pick a value for ? (1-9). The shared ? tile can be used once on each wheel.</div>
        <div class="pks" id="pks"></div>
      </div>
      <div class="wheels">
        <div class="wheel" id="wh0"><div class="wl">Left</div><div class="cards sm" id="wc0"></div></div>
        <div class="wheel" id="wh1"><div class="wl">Right</div><div class="cards sm" id="wc1"></div></div>
        <button class="num bridge" id="bridge" aria-label="Shared unknown value">?</button>
      </div>
    </div>
    <div class="ops" id="ops">
      <button class="op" data-op="+" aria-label="plus">+</button>
      <button class="op" data-op="-" aria-label="minus">−</button>
      <button class="op" data-op="*" aria-label="times">×</button>
      <button class="op" data-op="/" aria-label="divide">÷</button>
    </div>
    <div class="msg info" id="msg" aria-live="polite"></div>
    <div class="challenge" id="challenge"></div>
    <div class="row">
      <button class="btn" id="undo">Undo</button>
      <button class="btn" id="reset">Reset</button>
      <button class="btn" id="hint">Hint</button>
      <button class="btn" id="skip">Skip</button>
    </div>
    <div class="row" style="grid-template-columns:1fr 1fr">
      <button class="btn" id="reveal">Show answer</button>
      <button class="btn primary" id="next">New card</button>
    </div>
    <div class="hint" id="hintBox"></div>
  </section>

  <footer id="foot"></footer>
</main>

<script>
// ==SOLVER==
const SYM = {'+':'+','-':'−','*':'×','/':'÷'};
const gcd = (a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
function frac(n,d=1){ if(d<0){n=-n;d=-d} const g=gcd(n,d)||1; return [n/g,d/g]; }
const sgn = n => n<0 ? '−'+(-n) : String(n);
const fmt = ([n,d]) => d===1 ? sgn(n) : sgn(n)+'/'+d;
const fmtP = v => v[0]<0 ? '('+fmt(v)+')' : fmt(v); // negatives in parentheses when used as operands
function apply(op,a,b){
  switch(op){
    case '+': return frac(a[0]*b[1]+b[0]*a[1], a[1]*b[1]);
    case '-': return frac(a[0]*b[1]-b[0]*a[1], a[1]*b[1]);
    case '*': return frac(a[0]*b[0], a[1]*b[1]);
    case '/': return b[0]===0 ? null : frac(a[0]*b[1], a[1]*b[0]);
  }
}
// Returns distinct solutions to 24 as {d: expression, s: [steps]}
function solve(nums){
  const found = new Map();
  const start = nums.map(n=>({v:[n,1], d:n<0?'('+sgn(n)+')':String(n), c:String(n), s:[]}));
  (function rec(items){
    if(items.length===1){
      const it=items[0];
      if(it.v[0]===24 && it.v[1]===1 && !found.has(it.c)) found.set(it.c,it);
      return;
    }
    for(let i=0;i<items.length;i++){
      for(let j=i+1;j<items.length;j++){
        const a=items[i], b=items[j];
        const rest=items.filter((_,k)=>k!==i&&k!==j);
        for(const op of ['+','-','*','/']){
          const comm = op==='+'||op==='*';
          const pairs = comm ? [[a,b]] : [[a,b],[b,a]];
          for(const [x,y] of pairs){
            const v=apply(op,x.v,y.v);
            if(!v) continue;
            const c = comm ? '('+[x.c,y.c].sort().join(op)+')' : '('+x.c+op+y.c+')';
            const d = '('+x.d+' '+SYM[op]+' '+y.d+')';
            const s = [...x.s,...y.s, fmtP(x.v)+' '+SYM[op]+' '+fmtP(y.v)+' = '+fmt(v)];
            rec([...rest,{v,d,c,s}]);
          }
        }
      }
    }
  })(start);
  return [...found.values()].map(x=>({d:x.d.replace(/^\((.*)\)$/,'$1'), s:x.s}));
}
// Difficulty is the number of distinct ways to reach 24: fewer ways = harder.
const LEVELS = {
  easy:   {max:9,  min:8, hi:999},
  medium: {max:9,  min:3, hi:7},
  hard:   {max:13, min:1, hi:2}
};
function generate(level, seen){
  const L = LEVELS[level];
  for(let tries=0; tries<5000; tries++){
    const nums = Array.from({length:4}, ()=>1+Math.floor(Math.random()*L.max));
    const key = [...nums].sort((a,b)=>a-b).join(',');
    if(seen && seen.has(key)) continue;
    const sols = solve(nums);
    if(sols.length>=L.min && sols.length<=L.hi){
      if(seen) seen.add(key);
      return {nums, sols, key};
    }
  }
  return null;
}
// Negatives mode: whole numbers from -R to R (no zero), at least one negative.
const NLEVELS = {
  easy:   {R:5,  min:8, hi:999},
  medium: {R:9,  min:3, hi:12},
  hard:   {R:13, min:1, hi:2}
};
function generateNeg(level, seen){
  const L = NLEVELS[level];
  const rn = () => { let n; do { n = Math.floor(Math.random()*(2*L.R+1)) - L.R; } while(n===0); return n; };
  for(let tries=0; tries<5000; tries++){
    const nums = [rn(),rn(),rn(),rn()];
    if(!nums.some(n=>n<0)) continue;
    const key = [...nums].sort((a,b)=>a-b).join(',');
    if(seen && seen.has(key)) continue;
    const sols = solve(nums);
    if(sols.length>=L.min && sols.length<=L.hi){
      if(seen) seen.add(key);
      return {nums, sols, key};
    }
  }
  return null;
}
// ==END SOLVER==

// ==VARIABLES==
// Variables mode: two sets of 3 numbers share one unknown "?" (1-9).
// Exactly one value of ? makes 24 on both sets.
function can24(items){
  if(items.length===1) return items[0][0]===24 && items[0][1]===1;
  for(let i=0;i<items.length;i++) for(let j=i+1;j<items.length;j++){
    const a=items[i], b=items[j], rest=items.filter((_,k)=>k!==i&&k!==j);
    for(const op of ['+','-','*','/']){
      const ps=(op==='+'||op==='*')?[[a,b]]:[[a,b],[b,a]];
      for(const [x,y] of ps){ const v=apply(op,x,y); if(v && can24([...rest,v])) return true; }
    }
  }
  return false;
}
const VLEVELS = {
  easy:   {max:9,  lo:5, hi:999},
  medium: {max:13, lo:2, hi:4},
  hard:   {max:13, lo:1, hi:1}
};
const vpools = {};
// Every sorted triple 1..max with the list of ? values (1-9) that can make 24; kept if 2+ values work.
function vpool(max){
  if(vpools[max]) return vpools[max];
  const P=[];
  for(let a=1;a<=max;a++) for(let b=a;b<=max;b++) for(let c=b;c<=max;c++){
    const vs=[];
    for(let y=1;y<=9;y++) if(can24([a,b,c,y].map(n=>[n,1]))) vs.push(y);
    if(vs.length>=2) P.push({s:[a,b,c], vs, cnt:{}});
  }
  return vpools[max]=P;
}
const vcnt=(p,x)=>p.cnt[x] ?? (p.cnt[x]=solve([...p.s,x]).length);
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function generateVar(level, seen){
  const L=VLEVELS[level], P=vpool(L.max);
  for(let t=0;t<4000;t++){
    const x=1+Math.floor(Math.random()*9);
    const cand=P.filter(p=>p.vs.includes(x));
    if(cand.length<2) continue;
    let A=pickOne(cand);
    const Bs=cand.filter(p=>p!==A && p.vs.filter(v=>A.vs.includes(v)).length===1);
    if(!Bs.length) continue;
    let B=pickOne(Bs);
    const c=Math.min(vcnt(A,x), vcnt(B,x));
    if(c<L.lo || c>L.hi) continue;
    if(Math.random()<.5) [A,B]=[B,A];
    const key=[A.s.join(','),B.s.join(','),x].join('|');
    if(seen && seen.has(key)) continue;
    if(seen) seen.add(key);
    return {A:shuffle(A.s), B:shuffle(B.s), x, VA:A.vs, VB:B.vs,
            solsA:solve([...A.s,x]), solsB:solve([...B.s,x]), key};
  }
  return null;
}
// ==END VARIABLES==

if (typeof document !== 'undefined') (function(){
  const $ = id => document.getElementById(id);
  const store = {
    get(k,d){ try{ const v=localStorage.getItem('g24_'+k); return v===null?d:JSON.parse(v);}catch(e){return d} },
    set(k,v){ try{ localStorage.setItem('g24_'+k, JSON.stringify(v)); }catch(e){} }
  };
  const blank = () => ({solved:0, streak:0, best:{easy:null,medium:null,hard:null}});

  let mode  = store.get('mode','classic');
  let level = store.get('level','medium');
  const S = { classic: store.get('stats',blank()), var: store.get('vstats',blank()), neg: store.get('nstats',blank()) };
  const STATKEY = { classic:'stats', var:'vstats', neg:'nstats' };
  if(!S[mode]) mode='classic';
  const st = () => S[mode];
  const saveStats = () => store.set(STATKEY[mode], st());
  const seen = new Set();
  const NAMES = ['Left','Right'];

  let card, boards, history, sel, selOp, xVal, startT, timer, done, hintsShown, hintList, clean;

  $('level').value = level;

  function fmtTime(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
  function renderStats(){
    const s=st();
    $('sSolved').textContent = s.solved;
    $('sStreak').textContent = s.streak;
    const b = s.best[level];
    $('sBest').textContent = b==null ? '-' : fmtTime(b);
  }
  function tick(){ $('sTime').textContent = fmtTime(Math.floor((Date.now()-startT)/1000)); }
  function setMsg(t,cls,pop){
    const m=$('msg'); m.textContent=t; m.className='msg '+(cls||'info');
    if(pop){ void m.offsetWidth; m.classList.add('pop'); }
  }

  // ---- Encouragement messages ----
  const WIN_MSGS=['Good job!','Nice work!','You got it!','Great thinking!','Excellent!','Way to go!','Math whiz!','Spot on!'];
  const HELP_MSGS=['Nice finish!','You figured it out!','Good job sticking with it!'];
  const TRY_MSGS=['Not quite, try again!','So close! Give it another go.','Almost there, keep trying!','Good effort. Try a different way!','Hang in there. Undo and try again.'];
  const lastPick={};
  function pickMsg(key,list){
    let m,t=0;
    do{ m=list[Math.floor(Math.random()*list.length)]; } while(m===lastPick[key] && list.length>1 && ++t<20);
    lastPick[key]=m; return m;
  }
  function streakMsg(n){
    if(n===3) return "3 in a row, you're on fire!";
    if(n===5) return '5 in a row! Amazing!';
    if(n===10) return '10 in a row! Unstoppable!';
    return `${n} in a row! Incredible!`;
  }
  const isMilestone = n => n===3 || n%5===0;

  // ---- Sound (synthesized, no files) ----
  let soundOn = store.get('sound', true), actx = null;
  function audio(){
    try{
      if(!actx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; actx=new C(); }
      if(actx.state==='suspended') actx.resume();
      return actx;
    }catch(e){ return null; }
  }
  function tone(freq,start,dur,type,gain,slideTo){
    const a=audio(); if(!a) return;
    const t0=a.currentTime+start, o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(gain||.15,t0+.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+.05);
  }
  function sfx(kind){
    if(!soundOn) return;
    try{
      if(kind==='win'){ tone(659,0,.18); tone(880,.12,.28); }
      else if(kind==='big'){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.3,'triangle',.18)); tone(1319,.5,.5,'triangle',.18); }
      else if(kind==='try'){ tone(300,0,.25,'sine',.12,200); }
    }catch(e){}
  }
  const SVG='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
  const ICON_ON = SVG+'<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  const ICON_OFF = SVG+'<path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6M22 9l-6 6"/></svg>';
  function renderSnd(){ $('snd').innerHTML = soundOn?ICON_ON:ICON_OFF; $('snd').setAttribute('aria-label', soundOn?'Sound on':'Sound off'); }
  $('snd').onclick=()=>{ soundOn=!soundOn; store.set('sound',soundOn); renderSnd(); sfx('win'); };
  renderSnd();

  // ---- Confetti (canvas, ~2 seconds) ----
  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  function confetti(){
    if(reduceMotion) return;
    try{
      const cv=$('confetti'), ctx=cv.getContext('2d');
      const dpr=window.devicePixelRatio||1, W=cv.width=innerWidth*dpr, H=cv.height=innerHeight*dpr;
      cv.style.display='block';
      const colors=['#2f6fed','#1e9e5a','#f5b700','#e8553d','#a14df0','#16b8c9'];
      const P=Array.from({length:140},()=>({
        x:W/2+(Math.random()-.5)*W*.3, y:H*.35,
        vx:(Math.random()-.5)*16*dpr, vy:(-Math.random()*14-4)*dpr,
        s:(4+Math.random()*6)*dpr, r:Math.random()*6.28, vr:(Math.random()-.5)*.4,
        c:colors[Math.floor(Math.random()*colors.length)]
      }));
      const t0=performance.now();
      (function frame(now){
        const t=now-t0; ctx.clearRect(0,0,W,H);
        P.forEach(p=>{
          p.vy+=.45*dpr; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
          ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
          ctx.fillStyle=p.c; ctx.globalAlpha=Math.max(0,1-t/2200);
          ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore();
        });
        if(t<2200) requestAnimationFrame(frame);
        else { ctx.clearRect(0,0,W,H); cv.style.display='none'; }
      })(t0);
    }catch(e){}
  }

  // ---- Streak challenge prompt ----
  const MODE_LABEL={classic:'Classic',var:'Variables',neg:'Negatives'};
  const cap = s => s[0].toUpperCase()+s.slice(1);
  function hideChallenge(){ const c=$('challenge'); c.style.display='none'; c.innerHTML=''; }
  function showChallenge(n){
    const c=$('challenge'); c.innerHTML='';
    const t=document.createElement('div'); t.className='ch-title'; t.textContent=`${n} in a row! Ready for a challenge?`; c.appendChild(t);
    const row=document.createElement('div'); row.className='ch-row'; c.appendChild(row);
    const add=(label,fn)=>{
      const b=document.createElement('button'); b.className='btn'; b.textContent=label;
      b.onclick=()=>{ hideChallenge(); if(fn) fn(); };
      row.appendChild(b);
    };
    const order=['easy','medium','hard'], i=order.indexOf(level);
    if(i<2) add('Harder level ('+cap(order[i+1])+')', ()=>setLevel(order[i+1]));
    ['classic','var','neg'].filter(m=>m!==mode).forEach(m=>add('Try '+MODE_LABEL[m], ()=>setMode(m)));
    add('Keep going');
    c.style.display='block';
  }
  function setLevel(l){
    level=l; $('level').value=l; store.set('level',level); seen.clear(); renderStats(); newCard();
  }
  function setMode(m){
    if(m===mode) return;
    mode=m; store.set('mode',mode); seen.clear(); applyModeUI(); renderStats(); newCard();
  }
  const defaultMsg = () => mode==='var' ? (xVal==null ? 'Pick a value for ?' : 'Make 24 on both wheels') : 'Make 24';

  function applyModeUI(){
    document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on', b.dataset.mode===mode));
    $('foot').textContent = mode==='var'
      ? 'Find the ? (1-9) that makes 24 on both wheels. Each wheel uses its three numbers plus the shared ?, each once.'
      : mode==='neg'
      ? 'Some numbers are negative. Combine all four with + − × ÷ to make 24. Each number is used once.'
      : 'Combine all four numbers with + − × ÷ to make 24. Each number is used once.';
  }

  function newCard(){
    hideChallenge();
    const needBuild = mode==='var' && !vpools[VLEVELS[level].max];
    if(needBuild){ setMsg('Building cards...'); setTimeout(doNew,30); } else doNew();
  }

  function doNew(){
    const c = mode==='var' ? generateVar(level, seen)
            : mode==='neg' ? generateNeg(level, seen)
            : generate(level, seen);
    if(!c){ setMsg('Could not generate a card, try again','bad'); return; }
    if(seen.size>400) seen.clear();
    card = c; xVal = null;
    resetBoards();
    startT = Date.now(); clearInterval(timer); timer=setInterval(tick,500); tick();
    done=false; clean=true; hintsShown=0; hintList=[];
    if(mode==='var'){
      const j=a=>a.join(', ');
      hintList=[
        `Left wheel makes 24 with ? = ${j(c.VA)}`,
        `Right wheel makes 24 with ? = ${j(c.VB)}`,
        `So ? = ${c.x}`,
        `Left wheel steps:\n${c.solsA[0].s.join('\n')}`,
        `Right wheel steps:\n${c.solsB[0].s.join('\n')}`
      ];
    } else {
      hintList = c.sols[0].s.map((_,i)=>c.sols[0].s.slice(0,i+1).join('\n')+(i<c.sols[0].s.length-1?'\n...':''));
    }
    $('hintBox').className='hint'; $('hintBox').textContent='';
    $('next').className='btn primary';
    $('next').textContent='New card';
    setMsg(defaultMsg());
    render();
  }

  function initItems(b){
    if(mode!=='var') return card.nums.map(n=>({v:[n,1]}));
    return (b===0 ? card.A : card.B).map(n=>({v:[n,1]}));
  }
  // In Variables mode each wheel has its own unused copy of the shared ? (xLeft).
  function resetBoards(){
    const n = mode==='var' ? 2 : 1;
    boards = Array.from({length:n}, (_,b)=>({items:initItems(b), solved:false, xLeft:mode==='var'}));
    history=[]; sel=null; selOp=null;
  }

  function label(it){
    const [n,d]=it.v;
    return d===1 ? sgn(n) : `<span style="display:inline-flex;flex-direction:column;align-items:center;line-height:1.05"><span style="border-bottom:3px solid currentColor;padding:0 6px">${sgn(n)}</span><span>${d}</span></span>`;
  }
  const boxFor = b => mode==='var' ? $('wc'+b) : $('cards');

  // Grid slot for each item. In Variables mode the empty slot sits next to the center
  // so the shared ? tile can overlap both wheels.
  const slotPos = b => mode!=='var' ? [0,1,2,3] : (b===0 ? [0,1,2] : [0,1,3]);
  const itemEl = (b,i) => boxFor(b).children[slotPos(b)[i]];

  function fill(b, pop){
    const box=boxFor(b); box.innerHTML='';
    const pos=slotPos(b);
    const bySlot={};
    boards[b].items.forEach((it,i)=>{ bySlot[pos[i]]=i; });
    const total = mode!=='var' ? boards[b].items.length : 4;
    for(let s=0;s<total;s++){
      const el=document.createElement('button');
      if(!(s in bySlot)){ el.className='num ph'; el.tabIndex=-1; el.setAttribute('aria-hidden','true'); box.appendChild(el); continue; }
      const i=bySlot[s], it=boards[b].items[i];
      let cls='num';
      if(sel && sel.b===b && sel.i===i) cls+=' sel';
      if(it.res) cls+=' res';
      if(it.v[1]!==1) cls+=' frac';
      if(pop && pop.b===b && pop.i===i) cls+=' pop';
      el.className=cls;
      el.innerHTML = label(it);
      el.setAttribute('aria-label', fmt(it.v));
      el.onclick=()=>pick(b,i);
      box.appendChild(el);
    }
  }

  function render(pop){
    const isVar = mode==='var';
    $('cards').style.display = isVar ? 'none' : 'grid';
    $('vbox').style.display = isVar ? 'block' : 'none';
    boards.forEach((_,b)=>fill(b,pop));
    if(isVar){
      boards.forEach((bd,b)=>$('wh'+b).classList.toggle('ok', bd.solved));
      const br=$('bridge');
      br.textContent = xVal==null ? '?' : xVal;
      br.className = 'num bridge'+(xVal!=null?' set':'')+(sel&&sel.x?' sel':'')+(boards.every(t=>!t.xLeft)?' dim':'');
      br.onclick = pickShared;
      document.querySelectorAll('.pk').forEach(p=>{
        p.classList.toggle('on', +p.dataset.x===xVal);
        p.disabled = done;
      });
    }
    document.querySelectorAll('.op').forEach(o=>o.classList.toggle('sel', o.dataset.op===selOp));
    $('undo').disabled = history.length===0 || done;
    $('reset').disabled = history.length===0 || done;
    $('hint').disabled = done;
    $('skip').disabled = false;
    $('reveal').disabled = done;
  }

  function pick(b,i){
    if(done) return;
    if(mode==='var' && xVal==null){ setMsg('Pick a value for ? first','info'); return; }
    if(boards[b].solved) return;
    if(sel===null){ sel={b,i}; render(); return; }
    if(sel.x){
      // shared ? was selected first: x op this number
      if(!selOp){ sel={b,i}; render(); return; }
      if(!boards[b].xLeft){ setMsg(`? is already used on the ${NAMES[b]} wheel`,'bad'); return; }
      combine(b, {x:true}, {i}, selOp); return;
    }
    if(sel.b===b && sel.i===i){ sel=null; render(); return; }
    if(sel.b!==b || !selOp){ sel={b,i}; render(); return; }
    combine(b, {i:sel.i}, {i}, selOp);
  }

  // Tap on the shared ? tile (Variables mode)
  function pickShared(){
    if(done) return;
    if(xVal==null){ setMsg('Pick a value for ? first','info'); return; }
    if(sel===null){ sel={x:true}; render(); return; }
    if(sel.x){ sel=null; render(); return; }
    if(!selOp){ sel={x:true}; render(); return; }
    if(!boards[sel.b].xLeft){ setMsg(`? is already used on the ${NAMES[sel.b]} wheel`,'bad'); return; }
    combine(sel.b, {i:sel.i}, {x:true}, selOp);
  }

  // Operands are {i: itemIndex} or {x:true} (the shared ?). Result replaces both.
  function combine(b, A, B, op){
    const bd=boards[b];
    const val = o => o.x ? [xVal,1] : bd.items[o.i].v;
    const v=apply(op,val(A),val(B));
    if(!v){
      setMsg('Cannot divide by zero','bad');
      const el = B.x ? $('bridge') : itemEl(b,B.i);
      if(el) el.classList.add('shake');
      sel=null; selOp=null; setTimeout(()=>render(),300); return;
    }
    history.push({b, items:bd.items.map(t=>({...t})), xLeft:bd.xLeft});
    const used=[A,B].filter(o=>!o.x).map(o=>o.i);
    if(A.x||B.x) bd.xLeft=false;
    const rest=bd.items.filter((_,k)=>!used.includes(k));
    bd.items=[...rest,{v,res:true}];
    sel=null; selOp=null;
    const side = mode==='var' ? NAMES[b]+' wheel' : 'That';
    if(bd.items.length===1 && !bd.xLeft){
      if(v[0]===24 && v[1]===1){
        bd.solved=true;
        if(boards.every(t=>t.solved)){ render({b,i:0}); return win(); }
        setMsg(`${side} done, nice! Now the other wheel.`,'good');
      } else {
        const tm=pickMsg('try',TRY_MSGS);
        setMsg(mode==='var'
          ? `${tm} The ${side.toLowerCase()} makes ${fmt(v)}, not 24.`
          : `${tm} That makes ${fmt(v)}.`,'bad');
        sfx('try');
      }
    } else setMsg(defaultMsg());
    render({b,i:bd.items.length-1});
  }

  function win(){
    done=true; clearInterval(timer);
    const secs=Math.floor((Date.now()-startT)/1000);
    const s=st();
    s.solved++;
    let newBest=false;
    if(clean){
      s.streak++;
      const b=s.best[level];
      if(b==null || secs<b){ if(b!=null) newBest=true; s.best[level]=secs; }
    } else s.streak=0;
    saveStats();
    const t=fmtTime(secs), extra = mode==='var' ? ` ? = ${xVal}.` : '';
    let text, big=false;
    if(!clean) text = `${pickMsg('help',HELP_MSGS)}${extra} Solved in ${t} (with help)`;
    else {
      const milestone=isMilestone(s.streak);
      text = (milestone ? streakMsg(s.streak) : pickMsg('win',WIN_MSGS)) + `${extra} Solved in ${t}`;
      if(newBest) text += '. New best time!';
      big = milestone || newBest;
    }
    setMsg(text,'good',true);
    sfx(big?'big':'win');
    if(big) confetti();
    $('next').textContent='Next card';
    renderStats(); render();
    if(clean && s.streak%5===0) showChallenge(s.streak);
  }

  // Variables: choose the value for ?
  function chooseX(y){
    if(done || xVal===y) return;
    xVal=y; resetBoards(); setMsg(defaultMsg()); render();
  }
  (function buildPicker(){
    const box=$('pks');
    for(let y=1;y<=9;y++){
      const b=document.createElement('button');
      b.className='pk'; b.dataset.x=y; b.textContent=y;
      b.onclick=()=>chooseX(y);
      box.appendChild(b);
    }
  })();

  document.querySelectorAll('.op').forEach(o=>o.onclick=()=>{
    if(done) return;
    if(sel===null){ setMsg('Pick a number first'); return; }
    selOp = selOp===o.dataset.op ? null : o.dataset.op;
    render();
  });

  $('undo').onclick=()=>{
    if(!history.length||done) return;
    const h=history.pop();
    boards[h.b].items=h.items; boards[h.b].xLeft=h.xLeft; boards[h.b].solved=false;
    sel=null; selOp=null; setMsg(defaultMsg()); render();
  };
  $('reset').onclick=()=>{ if(done) return; resetBoards(); setMsg(defaultMsg()); render(); };
  $('skip').onclick=()=>{ if(!done){ st().streak=0; saveStats(); renderStats(); } newCard(); };
  $('next').onclick=newCard;
  $('hint').onclick=()=>{
    if(done) return;
    clean=false;
    hintsShown=Math.min(hintsShown+1, hintList.length);
    const box=$('hintBox'); box.className='hint show';
    box.textContent = mode==='var'
      ? 'Hint:\n'+hintList.slice(0,hintsShown).join('\n\n')
      : 'Hint:\n'+hintList[hintsShown-1];
  };
  $('reveal').onclick=()=>{
    if(done) return;
    clean=false; done=true; clearInterval(timer);
    st().streak=0; saveStats(); renderStats();
    const box=$('hintBox'); box.className='hint show';
    if(mode==='var'){
      box.textContent=`? = ${card.x}\nLeft: ${card.solsA[0].d} = 24\nRight: ${card.solsB[0].d} = 24`;
      xVal=card.x; resetBoards();
    } else box.textContent='One solution:\n'+card.sols[0].d+' = 24';
    setMsg('Answer shown','info');
    $('next').textContent='Next card';
    render();
  };
  $('level').onchange=e=>setLevel(e.target.value);
  document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

  applyModeUI();
  renderStats();
  newCard();
})();
</script>
</body>
</html>
